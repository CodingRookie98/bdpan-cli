name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  pypi-publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bdpan-cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            binary_name: bdpan-linux-amd64
          - os: macos-14
            target: macos-arm64
            binary_name: bdpan-macos-arm64
          - os: windows-latest
            target: windows-amd64
            binary_name: bdpan-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build standalone binary with PyInstaller (POSIX)
        if: runner.os != 'Windows'
        run: |
          uv run pyinstaller --onefile --name ${{ matrix.binary_name }} src/bdpan_cli/cli.py
          chmod +x dist/${{ matrix.binary_name }}

      - name: Build standalone binary with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller --onefile --name ${{ matrix.binary_name }} src/bdpan_cli/cli.py

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.binary_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
