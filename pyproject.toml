[project]
name = "bd-net-disc-mgr"
version = "0.1.0"
description = "个人百度网盘文件数据资料管理工具"
readme = "README.md"
authors = [
    { name = "CodingRookie98", email = "520whjoker@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "baidu-pan-sdk",
    "python-dotenv>=1.2.3",
]

[project.scripts]
bd-net-disc-mgr = "bd_net_disc_mgr:main"

[tool.uv.sources]
baidu-pan-sdk = { path = "vendor/baidu-pan-sdk", editable = true }

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
