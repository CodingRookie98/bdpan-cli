[project]
name = "bdpan-cli"
version = "0.1.0"
description = "百度网盘工程化 CLI 管理工具"
readme = "README.md"
authors = [
    { name = "CodingRookie98", email = "520whjoker@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "baidu-pan-sdk",
    "python-dotenv>=1.2.3",
]

[project.scripts]
bdpan = "bdpan_cli.cli:main"
bdpan-cli = "bdpan_cli.cli:main"
bd-net-disc-mgr = "bdpan_cli.cli:main"

[tool.uv.sources]
baidu-pan-sdk = { path = "vendor/baidu-pan-sdk", editable = true }

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_lint -p no:launch_testing -p no:launch_testing_ros -p no:launch_testing_ros_pytest_entrypoint"



