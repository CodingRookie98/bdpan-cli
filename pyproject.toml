[project]
name = "bdpan-cli"
version = "0.1.0"
description = "百度网盘工程化 CLI 管理工具"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "CodingRookie98", email = "520whjoker@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.3",
    "urllib3>=1.25.3",
    "python-dateutil>=2.9.0.post0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
]
keywords = ["baidu-pan", "netdisk", "cli", "scraper", "backup", "cloud-storage"]

[project.urls]
Homepage = "https://github.com/CodingRookie98/bdpan-cli"
Repository = "https://github.com/CodingRookie98/bdpan-cli"
Documentation = "https://github.com/CodingRookie98/bdpan-cli#readme"

[project.scripts]
bdpan = "bdpan_cli.cli:main"
bdpan-cli = "bdpan_cli.cli:main"
bd-net-disc-mgr = "bdpan_cli.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyinstaller>=6.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_lint -p no:launch_testing -p no:launch_testing_ros -p no:launch_testing_ros_pytest_entrypoint"



